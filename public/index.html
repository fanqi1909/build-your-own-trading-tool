<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Dashboard</title>
  <link rel="stylesheet" href="/core/theme.css">
</head>
<body>

  <!-- Use mode: dashboard + controls bar -->
  <div id="app">
    <div id="app-controls">
      <span id="status" title="WebSocket"></span>
      <button id="build-btn" title="Build Dashboard">⚙</button>
    </div>
    <main id="layout-grid"></main>
  </div>

  <!-- Chat: floating trigger + slide-in panel (all modes) -->
  <button id="chat-trigger" title="AI Assistant">✦</button>
  <div id="chat-backdrop"></div>
  <aside id="chat-panel"></aside>

  <!-- Build mode: fullscreen overlay -->
  <div id="builder-overlay" hidden>
    <div id="builder-panel"></div>
  </div>

  <script type="module" src="/core/app.js"></script>
</body>
</html>
