<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Dashboard</title>
  <link rel="stylesheet" href="/core/theme.css">
</head>
<body>
  <div id="app">
    <div id="app-controls">
      <span id="status" title="WebSocket"></span>
      <button id="build-btn" title="Build Dashboard">⚙ Build</button>
    </div>

    <div id="tabs-bar"></div>
    <div id="build-topbar" hidden></div>

    <div id="workspace">
      <div id="build-left" hidden></div>
      <main id="layout-grid"></main>
    </div>
  </div>

  <button id="chat-trigger" title="AI Assistant">✦</button>
  <div id="chat-backdrop"></div>
  <aside id="chat-panel"></aside>

  <script type="module" src="/core/app.js"></script>
</body>
</html>
