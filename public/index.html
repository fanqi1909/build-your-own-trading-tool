<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Tool Builder</title>
  <link rel="stylesheet" href="/core/theme.css">
</head>
<body>
  <div id="app">

    <!-- AI Chat — always visible -->
    <aside id="chat-panel">
      <div class="chat-header">
        <span id="status"></span>
        <span>AI Assistant</span>
      </div>
      <div class="chat-body">
        <p class="chat-hint">
          <strong>Chat coming in Phase 4.</strong><br><br>
          For now, open the browser console and try:<br><br>
          <code>app.layout.add('ticker')</code><br>
          <code>app.layout.remove('ticker')</code><br>
          <code>app.layout.list()</code>
        </p>
      </div>
    </aside>

    <!-- Dynamic component grid — managed by LayoutManager -->
    <main id="layout-grid"></main>

  </div>
  <script type="module" src="/core/app.js"></script>
</body>
</html>
