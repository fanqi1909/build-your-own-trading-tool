<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Dashboard — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0e1a;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #e2e8f0;
    }

    .card {
      width: 320px;
      padding: 36px 32px;
      background: rgba(17, 20, 31, 0.95);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    }

    .logo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #00e5ff;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 7px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 18px;
    }
    input[type="password"]:focus {
      border-color: rgba(0,229,255,0.45);
    }

    button {
      width: 100%;
      padding: 11px;
      background: rgba(0,229,255,0.12);
      border: 1px solid rgba(0,229,255,0.3);
      border-radius: 7px;
      color: #00e5ff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover  { background: rgba(0,229,255,0.2); }
    button:active { background: rgba(0,229,255,0.08); }

    .error {
      margin-top: 12px;
      font-size: 12px;
      color: #ef5350;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">OKX Dashboard</div>
    <h1>Sign in</h1>
    <form id="form">
      <label for="pw">Access Password</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" autofocus>
      <button type="submit">Enter →</button>
      <div class="error" id="err"></div>
    </form>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw  = document.getElementById('pw').value;
      const err = document.getElementById('err');
      err.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const d = await res.json().catch(() => ({}));
          err.textContent = d.error || 'Login failed';
          document.getElementById('pw').value = '';
        }
      } catch {
        err.textContent = 'Network error';
      }
    });
  </script>
</body>
</html>
